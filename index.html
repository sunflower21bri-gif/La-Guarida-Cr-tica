<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Guarida Crítica - Películas, Libros y Cómics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <canvas id="starfield-canvas"></canvas>

  <header class="navbar">
    <div class="logo-group">
      <div class="mascot-container" id="interactive-mascot">
        <div class="speech-bubble" id="mascot-speech">¡Hola! Listo para una buena reseña 🦊☕</div>
        <div class="mascot-svg-wrapper">
          <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <path d="M 30 50 L 33 42 L 41 39 L 33 36 L 30 28 L 27 36 L 19 39 L 27 42 Z" fill="#B8B8E8" filter="url(#glowEffect)"/>
            <path d="M 200 40 L 202 34 L 208 32 L 202 30 L 200 24 L 198 30 L 192 32 L 198 34 Z" fill="#E85860" filter="url(#glowEffect)"/>
            <!-- Libro -->
            <path d="M 30 195 Q 60 180 95 195 L 95 230 Q 60 215 30 230 Z" fill="#F8F6FF" stroke="#304070" stroke-width="3" stroke-linejoin="round"/>
            <path d="M 95 195 Q 130 180 160 195 L 160 230 Q 130 215 95 230 Z" fill="#F8F6FF" stroke="#304070" stroke-width="3" stroke-linejoin="round"/>
            <path d="M 95 195 L 95 230" stroke="#304070" stroke-width="3"/>
            <!-- Cola -->
            <path d="M 160 180 C 200 190 225 140 210 100 C 195 120 175 150 160 180 Z" fill="#E85860" stroke="#304070" stroke-width="3" stroke-linejoin="round"/>
            <!-- Cuerpo y Cabeza -->
            <ellipse cx="130" cy="155" rx="36" ry="28" fill="#E85860" stroke="#304070" stroke-width="3"/>
            <polygon points="90,105 108,65 125,98" fill="#E85860" stroke="#304070" stroke-width="3" stroke-linejoin="round"/>
            <polygon points="120,95 142,70 155,105" fill="#E85860" stroke="#304070" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="122" cy="115" r="32" fill="#E85860" stroke="#304070" stroke-width="3"/>
            <path d="M 102 118 Q 122 142 142 118 Q 122 132 102 118 Z" fill="#FFFFFF"/>
            <!-- Gafas -->
            <circle cx="112" cy="112" r="18" fill="none" stroke="#304070" stroke-width="3.5"/>
            <circle cx="138" cy="112" r="18" fill="none" stroke="#304070" stroke-width="3.5"/>
            <line x1="130" y1="112" x2="114" y2="112" stroke="#304070" stroke-width="3"/>
            <!-- Taza café -->
            <rect x="92" y="132" width="22" height="18" rx="4" fill="#F8C291" stroke="#304070" stroke-width="2.5"/>
          </svg>
        </div>
      </div>

      <div>
        <h1 class="logo-title">La Guarida Crítica</h1>
        <p class="logo-sub">Estación espacial de opiniones y reseñas 🚀🦊☕</p>
      </div>
    </div>

    <div class="auth-box">
      <button id="btn-login" class="btn-zip">🔑 Iniciar Sesión con Google</button>
      <div id="user-info" class="hidden user-badge">
        <img id="user-avatar" src="" alt="Avatar" class="avatar-img">
        <span id="user-name"></span>
        <button id="btn-logout" class="btn-logout-ctrl">Salir</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <aside class="panel-side">
      <div class="glass-card">
        <div class="card-head">
          <h2>✨ Nueva Reseña Estelar</h2>
          <p>Inicia sesión para publicar tu crítica</p>
        </div>

        <form id="forum-form">
          <div class="form-group">
            <label for="media-type">Categoría</label>
            <select id="media-type" class="input-ctrl">
              <option value="Pelicula">🎬 Película</option>
              <option value="Libro">📖 Libro / Novela</option>
              <option value="Comic">💥 Cómic / Manga</option>
            </select>
          </div>

          <div class="form-group">
            <label for="title">Título</label>
            <input type="text" id="title" class="input-ctrl" placeholder="Ej: Interstellar, Dune..." required>
          </div>

          <div class="form-group">
            <label for="creator">Director / Autor(a)</label>
            <input type="text" id="creator" class="input-ctrl" placeholder="Ej: Christopher Nolan..." required>
          </div>

          <div class="form-group">
            <label for="author">Tu Nick (Automático por Google)</label>
            <input type="text" id="author" class="input-ctrl" placeholder="Inicia sesión primero..." readonly required>
          </div>

          <div class="form-group">
            <label>Etiquetas / Géneros</label>
            <div class="tags-picker-grid" id="tags-picker">
              <button type="button" class="tag-chip-btn" data-tag="Comedia">😂 Comedia</button>
              <button type="button" class="tag-chip-btn" data-tag="Suspenso">🕵️ Suspenso</button>
              <button type="button" class="tag-chip-btn" data-tag="Accion">💥 Acción</button>
              <button type="button" class="tag-chip-btn" data-tag="Ciencia Ficción">🚀 Sci-Fi</button>
              <button type="button" class="tag-chip-btn" data-tag="Romance">💖 Romance</button>
              <button type="button" class="tag-chip-btn" data-tag="Terror">👻 Terror</button>
            </div>
          </div>

          <div class="form-group">
            <label>Foto de Portada (Enlace URL)</label>
            <input type="url" id="cover-url" class="input-ctrl" placeholder="https://ejemplo.com/portada.jpg">
          </div>

          <div class="form-group">
            <label>Puntuación (Estrellas)</label>
            <div class="stars-picker" id="stars-picker">
              <span class="star-btn" data-value="1">★</span>
              <span class="star-btn" data-value="2">★</span>
              <span class="star-btn" data-value="3">★</span>
              <span class="star-btn" data-value="4">★</span>
              <span class="star-btn" data-value="5">★</span>
            </div>
            <input type="hidden" id="rating-val" value="5">
          </div>

          <div class="form-group">
            <label for="comment">Tu Reseña</label>
            <textarea id="comment" rows="3" class="input-ctrl textarea-ctrl" placeholder="Escribe tu opinión..." required></textarea>
          </div>

          <button type="submit" id="btn-submit-post" class="btn-submit" disabled>Inicia sesión para publicar 🚀</button>
        </form>
      </div>
    </aside>

    <section class="panel-content">
      <div class="glass-card filters-card">
        <div class="category-tabs">
          <button class="cat-btn active" onclick="setCategoryFilter('all')">Todos (<span id="count-all">0</span>)</button>
          <button class="cat-btn" onclick="setCategoryFilter('Pelicula')">🎬 Películas</button>
          <button class="cat-btn" onclick="setCategoryFilter('Libro')">📖 Libros</button>
          <button class="cat-btn" onclick="setCategoryFilter('Comic')">💥 Cómics</button>
        </div>

        <div class="search-sort-row">
          <div class="search-field">
            <input type="text" id="search-input" placeholder="Buscar en la guarida...">
          </div>
          <select id="sort-select" class="input-ctrl sort-select">
            <option value="newest">Más recientes</option>
            <option value="rating-desc">Mejor valorados</option>
          </select>
        </div>
      </div>

      <div id="posts-container" class="posts-feed"></div>
    </section>
  </main>

  <footer class="footer">
    <p>🌌 <strong>La Guarida Crítica</strong> &copy; 2026 — Sincronizado en la nube con Firebase.</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
